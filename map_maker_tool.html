<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hue Nicorn - Map Maker</title>
  <style>
    :root {
      --red: #e33f3f;
      --red2: #b80505;
      --yellow: #fad354;
      --yellow2: #e9a33a;
      --orange: #df6807;
      --orange2: #a13c05;
      --green: #74bc57;
      --green2: #477c31;
      --cyan: #64c1dd;
      --cyan2: #35b7de;
      --blue: #2f52c6;
      --blue2: #1a2e70;
      --magenta: #f39be6;
      --magenta2: #da5dc7;
      --magenta3: #a42d92;
      --black: #131217;
      --white: #f9f9f9;

      --ink: var(--white);
      --line: #00000033;
      --panel: #0000002f;
      --cell: #ffffffec;
      --cell-hover: #fffffff8;
      --selected: var(--yellow);
      --warn: #ffd0d0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      color: var(--ink);
      font-family: "Trebuchet MS", "Gill Sans", "Verdana", sans-serif;
      background: var(--magenta3);
    }

    body {
      display: flex;
      flex-direction: column;
      max-width: 980px;
      margin: auto;
      position: relative;
      padding: 1rem;
      user-select: none;
    }

    main {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1rem;
      align-items: start;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 16px;
      box-shadow:
        inset 0 1px 0 #ffffff40,
        0 0.4rem 0 0 #0000002b;
    }

    .board-wrap {
      padding: 1rem;
    }

    h1 {
      margin: 0 0 0.65rem;
      font-size: 1.35rem;
      line-height: 1.2;
      letter-spacing: 0.02em;
      text-align: center;
      color: var(--white);
      text-shadow: 0 2px 0 #00000040;
    }

    .sub {
      margin: 0 0 1rem;
      font-size: 0.92rem;
      opacity: 0.92;
      color: #f8e8ff;
      text-align: center;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      width: min(100%, 620px);
      aspect-ratio: 1 / 1;
      border: 2px solid var(--line);
      border-radius: 10px;
      overflow: clip;
      background: var(--magenta2);
      margin: 0 auto;
    }

    .cell {
      border: 1px solid #0000002b;
      padding: 0;
      min-width: 0;
      min-height: 0;
      background: var(--cell);
      display: grid;
      place-items: center;
      font-size: clamp(1rem, 2.6vw, 1.55rem);
      line-height: 1;
      cursor: pointer;
      transition: background-color 120ms ease, transform 90ms ease;
      user-select: none;
    }

    .cell:hover {
      background: var(--cell-hover);
      z-index: 1;
    }

    .controls {
      padding: 0.9rem;
      display: grid;
      gap: 0.8rem;
    }

    .label {
      font-size: 0.86rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.95;
      margin-bottom: 0.35rem;
      color: #ebffe8;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.45rem;
    }

    .tool {
      border: none;
      border-radius: 14px;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 0;
      background: white;
      box-shadow: 0 0.26rem 0 0 #ccc;
      color: #000000d0;
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 90ms ease, box-shadow 90ms ease;
    }

    .tool.selected {
      box-shadow: 0 0.12rem 0 0 var(--cyan2);
      transform: translateY(0.14rem);
      outline: 2px solid var(--selected);
    }

    .tool .token {
      font-size: 0.52rem;
      letter-spacing: 0.03em;
      font-weight: 800;
      text-shadow: 0 1px 0 #ffffff80;
      margin-top: -0.2rem;
    }

    .row {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    button.action {
      border: none;
      color: #ffffff;
      background: var(--red);
      box-shadow: 0 0.25rem 0 0 var(--red2);
      border-radius: 12px;
      padding: 0.45rem 0.65rem;
      font-weight: 700;
      cursor: pointer;
    }

    button.action:active {
      box-shadow: 0 0.08rem 0 0 var(--red2);
      transform: translateY(0.17rem);
    }

    button.alt {
      background: var(--orange);
      color: #00000099;
      box-shadow: 0 0.25rem 0 0 var(--orange2);
    }

    button.alt:active {
      box-shadow: 0 0.08rem 0 0 var(--orange2);
      transform: translateY(0.17rem);
    }

    textarea {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      border: 1px solid #00000030;
      border-radius: 8px;
      padding: 0.55rem;
      font-family: "Courier New", monospace;
      font-size: 0.82rem;
      background: #ffffffea;
      color: #13261b;
    }

    .note {
      font-size: 0.82rem;
      opacity: 0.9;
    }

    .inventory-bits {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.35rem;
    }

    .gem-bit {
      border: none;
      border-radius: 10px;
      background: var(--white);
      color: var(--black);
      padding: 0.25rem 0.2rem;
      display: grid;
      place-items: center;
      gap: 0.1rem;
      cursor: pointer;
      box-shadow: 0 0.2rem 0 0 #00000022;
      font-size: 0.95rem;
      line-height: 1;
    }

    .gem-bit.selected {
      background: var(--yellow);
      box-shadow: 0 0.1rem 0 0 var(--orange2);
      transform: translateY(0.1rem);
    }

    .gem-bit-token {
      font-size: 0.56rem;
      font-weight: 800;
      opacity: 0.85;
    }

    .error {
      color: var(--warn);
      min-height: 1.2em;
      font-size: 0.83rem;
      font-weight: 700;
    }

    .solution {
      margin: 0;
      padding-left: 1.2rem;
      display: grid;
      gap: 0.28rem;
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .solution li {
      color: #fff7ec;
    }

    .complexity {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: #fff7ec;
    }

    .complexity input {
      flex: 1;
    }

    .complexity-output {
      min-width: 5.5ch;
      text-align: right;
      font-weight: 700;
    }

    code {
      background: #ffffff2e;
      border: 1px solid #ffffff35;
      border-radius: 6px;
      padding: 0.06rem 0.3rem;
      font-size: 0.8rem;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel board-wrap">
      <h1>Hue Nicorn Map Maker</h1>
      <div id="grid" role="grid" aria-label="10 by 10 map grid"></div>
    </section>

    <aside class="panel controls">
      <div>
        <div class="label">Palette</div>
        <div id="palette" class="palette"></div>
      </div>

      <div>
        <div class="label">Actions</div>
        <div class="row">
          <button id="clearBtn" class="action alt" type="button">Clear Map</button>
          <button id="fillBtn" class="action alt" type="button">Fill Empty</button>
          <button id="generateBtn" class="action" type="button">Generate</button>
        </div>
        <div class="complexity" style="margin-top: 0.6rem;">
          <span>Steps</span>
          <input id="complexity" type="range" min="0" max="8" value="4" />
          <output id="complexityValue" class="complexity-output">4</output>
        </div>
      </div>

      <div>
        <div class="label">Initial Inventory</div>
        <div id="initialInventory" class="inventory-bits"></div>
      </div>

      <div>
        <div class="label">Compact String</div>
        <textarea id="encoded" placeholder="Encoded map appears here"></textarea>
        <div class="row" style="margin-top: 0.4rem;">
          <button id="encodeBtn" class="action" type="button">Encode</button>
          <button id="decodeBtn" class="action" type="button">Decode</button>
          <button id="copyBtn" class="action alt" type="button">Copy</button>
        </div>
      </div>

      <div id="error" class="error"></div>

      <div>
        <div class="label">Solution</div>
        <ol id="solution" class="solution"></ol>
      </div>
    </aside>
  </main>

  <script>
    const WIDTH = 10;
    const HEIGHT = 10;
    const CELL_COUNT = WIDTH * HEIGHT;
    const MAP_VERSION_BITS_PER_CELL = 5;
    const LEGACY_BITS_PER_CELL = 4;

    const ITEMS = [
      ["FR", "🍓"],
      ["FO", "🍊"],
      ["FY", "🍌"],
      ["FG", "🥝"],
      ["FC", "💧"],
      ["FB", "🫐"],
      ["FV", "🍇"],
      ["GR", "❤️"],
      ["GO", "🧡"],
      ["GY", "💛"],
      ["GG", "💚"],
      ["GC", "🩵"],
      ["GB", "💙"],
      ["GV", "💜"],
      ["GK", "🖤"],
      ["GW", "🤍"],
      ["HD", "🟩"],
      ["HN", "👉"],
      ["HL", "🌊"],
      ["HG", "🌱"],
    ];
    const UNICORN = ["UN", "🦄"];
    const ELEMENTS = [UNICORN, ...ITEMS];
    const BITS_PER_CELL = Math.max(4, Math.ceil(Math.log2(ELEMENTS.length + 1)));
    const RAINBOW_GEMS = [
      ["GR", "❤️"],
      ["GO", "🧡"],
      ["GY", "💛"],
      ["GG", "💚"],
      ["GC", "🩵"],
      ["GB", "💙"],
      ["GV", "💜"],
    ];

    const TOOL_EMPTY = { kind: "empty", label: "Empty", emoji: "·", token: "--" };
    const TOOL_ITEMS = ELEMENTS.map(([token, emoji], i) => ({
      kind: "item",
      itemCode: i + 1,
      emoji,
      token,
      label: `${token} ${emoji}`,
    }));
    const TOOLS = [TOOL_EMPTY, ...TOOL_ITEMS];

    const gridEl = document.getElementById("grid");
    const paletteEl = document.getElementById("palette");
    const initialInventoryEl = document.getElementById("initialInventory");
    const encodedEl = document.getElementById("encoded");
    const errorEl = document.getElementById("error");
    const solutionEl = document.getElementById("solution");
    const complexityEl = document.getElementById("complexity");
    const complexityValueEl = document.getElementById("complexityValue");

    const encodeBtn = document.getElementById("encodeBtn");
    const decodeBtn = document.getElementById("decodeBtn");
    const copyBtn = document.getElementById("copyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const fillBtn = document.getElementById("fillBtn");
    const generateBtn = document.getElementById("generateBtn");

    const itemGrid = new Uint8Array(CELL_COUNT);
    const initialInventoryBits = new Uint8Array(RAINBOW_GEMS.length);
    let selectedTool = TOOL_ITEMS[0];
    let isMouseDown = false;
    let activeMouseButton = -1;

    const CR = 0;
    const CO = 1;
    const CY = 2;
    const CG = 3;
    const CC = 4;
    const CB = 5;
    const CV = 6;
    const CK = 7;
    const CW = 8;

    const GEM_BY_COLOR = ["GR", "GO", "GY", "GG", "GC", "GB", "GV", "GK", "GW"];
    const FRUIT_BY_COLOR = ["FR", "FO", "FY", "FG", "FC", "FB", "FV"];
    const OP_NAME = { add: "ADD", sub: "SUB" };

    const LUT_W = 7;
    const COMPLEMENT_LUT = [CG, CB, CV, CR, CO, CO, CY, CW, CK];
    const ADD_LUT = "0112666111236811233382233444633444566344566884566";
    const SUB_LUT = "7000000270111122722223347223444573455556744666067";

    function lookupAdd(left, right) {
      if (left === CK) return right;
      if (right === CK) return left;
      if (left === CW || right === CW) return CW;
      return ADD_LUT.charCodeAt(left * LUT_W + right) - 48;
    }

    function lookupSub(left, right) {
      if (left === CK) return CK;
      if (left === CW) return COMPLEMENT_LUT[right];
      if (right === CW) return CK;
      if (right === CK) return left;
      return SUB_LUT.charCodeAt(left * LUT_W + right) - 48;
    }

    const TOKEN_TO_CODE = new Map(ELEMENTS.map(([token], i) => [token, i + 1]));

    const REVERSE_SPELLS = (() => {
      const out = Array.from({ length: 9 }, () => []);
      for (let left = 0; left <= CW; left += 1) {
        for (let right = 0; right <= CW; right += 1) {
          out[lookupAdd(left, right)].push({ kind: "add", left, right });
          out[lookupSub(left, right)].push({ kind: "sub", left, right });
        }
      }
      return out;
    })();

    function clearSolution() {
      solutionEl.replaceChildren();
    }

    function getComplexity() {
      return Number(complexityEl.value) || 0;
    }

    function syncComplexityLabel() {
      complexityValueEl.value = String(getComplexity());
      complexityValueEl.textContent = String(getComplexity());
    }

    function renderSolution(plan) {
      clearSolution();

      const ingredientLine = document.createElement("li");
      ingredientLine.textContent = `Inputs: ${plan.tokens.join(", ")}`;
      solutionEl.appendChild(ingredientLine);

      for (const step of plan.steps) {
        const item = document.createElement("li");
        item.textContent = `${GEM_BY_COLOR[step.target]} = ${GEM_BY_COLOR[step.left]} ${OP_NAME[step.kind]} ${GEM_BY_COLOR[step.right]}`;
        solutionEl.appendChild(item);
      }
    }

    function getInitialInventoryMask() {
      let mask = 0;
      for (let i = 0; i < initialInventoryBits.length; i += 1) {
        if (initialInventoryBits[i]) {
          mask |= 1 << i;
        }
      }
      return mask;
    }

    function setInitialInventoryFromMask(mask) {
      for (let i = 0; i < initialInventoryBits.length; i += 1) {
        initialInventoryBits[i] = (mask >> i) & 1;
      }
      renderInitialInventoryBits();
    }

    function renderInitialInventoryBits() {
      if (!initialInventoryEl) {
        return;
      }

      [...initialInventoryEl.children].forEach((button, index) => {
        button.classList.toggle("selected", initialInventoryBits[index] === 1);
      });
    }

    function cellIndex(x, y) {
      return y * WIDTH + x;
    }

    function cellAt(index) {
      return gridEl.children[index];
    }

    function randInt(min, max) {
      return min + Math.floor(Math.random() * (max - min + 1));
    }

    function pickOne(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function shuffleInPlace(arr) {
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    function collectSolutionSteps(nodes, steps) {
      for (const node of nodes) {
        if (!node.kind) {
          continue;
        }
        collectSolutionSteps([node.left, node.right], steps);
        steps.push({
          kind: node.kind,
          left: node.left.color,
          right: node.right.color,
          target: node.color,
        });
      }
    }

    function generateMutationPlan() {
      const roots = [CR, CO, CY, CG, CC, CB, CV, CK, CW].map((color) => ({ color }));
      const leaves = [...roots];
      const expansionCount = Math.min(getComplexity(), CELL_COUNT - roots.length);

      for (let i = 0; i < expansionCount; i += 1) {
        const pickIndex = Math.floor(Math.random() * leaves.length);
        const target = leaves[pickIndex];
        const reversePairs = REVERSE_SPELLS[target.color];
        if (!reversePairs.length) {
          continue;
        }

        const pair = pickOne(reversePairs);
        const left = { color: pair.left };
        const right = { color: pair.right };
        target.kind = pair.kind;
        target.left = left;
        target.right = right;
        leaves.splice(pickIndex, 1, left, right);
      }

      const selectedCount = randInt(1, leaves.length);
      const selectedIndexes = shuffleInPlace([...Array(leaves.length).keys()]).slice(0, selectedCount);
      const selectedSet = new Set(selectedIndexes);
      const tokens = [];

      for (let i = 0; i < leaves.length; i += 1) {
        const color = leaves[i].color;
        if (selectedSet.has(i) && color >= CR && color <= CV) {
          const fruit = FRUIT_BY_COLOR[color];
          tokens.push(fruit, fruit, fruit);
        } else {
          tokens.push(GEM_BY_COLOR[color]);
        }
      }

      const steps = [];
      collectSolutionSteps(roots, steps);
      return { tokens, steps };
    }

    function placeGeneratedItemsRandom(tokens) {
      const available = [];
      for (let i = 0; i < CELL_COUNT; i += 1) {
        if (itemGrid[i] === 0) {
          available.push(i);
        }
      }

      if (tokens.length > available.length) {
        throw new Error(`Not enough empty cells (${tokens.length} items, ${available.length} empty).`);
      }

      const groups = new Map();
      for (const token of tokens) {
        const list = groups.get(token);
        if (list) {
          list.push(token);
        } else {
          groups.set(token, [token]);
        }
      }

      const remaining = new Set(available);
      const neighborsOf = (index) => {
        const x = index % WIDTH;
        const y = (index / WIDTH) | 0;
        const out = [];
        if (x > 0) out.push(index - 1);
        if (x + 1 < WIDTH) out.push(index + 1);
        if (y > 0) out.push(index - WIDTH);
        if (y + 1 < HEIGHT) out.push(index + WIDTH);
        return shuffleInPlace(out);
      };

      const takeAny = () => {
        const cells = [...remaining];
        return cells[Math.floor(Math.random() * cells.length)];
      };

      const takeNear = (cluster) => {
        const frontier = [];
        for (const index of cluster) {
          for (const next of neighborsOf(index)) {
            if (remaining.has(next) && !frontier.includes(next)) {
              frontier.push(next);
            }
          }
        }
        return frontier.length ? pickOne(frontier) : takeAny();
      };

      const entries = [...groups.entries()];
      shuffleInPlace(entries);
      entries.sort((a, b) => b[1].length - a[1].length);

      for (const [token, group] of entries) {
        const code = TOKEN_TO_CODE.get(token);
        if (!code) {
          throw new Error(`Unknown token: ${token}`);
        }

        const cluster = [];
        for (let i = 0; i < group.length; i += 1) {
          const cell = cluster.length ? takeNear(cluster) : takeAny();
          remaining.delete(cell);
          cluster.push(cell);
          itemGrid[cell] = code;
        }
      }

      renderAllCells();
    }

    function currentCellGlyph(index) {
      const code = itemGrid[index];
      if (code === 0) {
        return "";
      }
      const entry = ELEMENTS[code - 1];
      return entry ? entry[1] : "";
    }

    function renderCell(index) {
      const cell = cellAt(index);
      if (!cell) {
        return;
      }
      cell.textContent = currentCellGlyph(index);
    }

    function renderAllCells() {
      for (let i = 0; i < CELL_COUNT; i += 1) {
        renderCell(i);
      }
    }

    function setTool(tool) {
      selectedTool = tool;
      [...paletteEl.children].forEach((btn) => {
        btn.classList.toggle("selected", btn.dataset.toolKey === toolKey(tool));
      });
    }

    function toolKey(tool) {
      if (tool.kind === "item") {
        return `item:${tool.itemCode}`;
      }
      return tool.kind;
    }

    function applyTool(index) {
      const tool = selectedTool;
      clearSolution();
      if (tool.kind === "empty") {
        itemGrid[index] = 0;
      } else if (tool.kind === "item") {
        if (tool.itemCode === 1) {
          // Keep unicorn unique by clearing any previous unicorn cell.
          for (let i = 0; i < CELL_COUNT; i += 1) {
            if (itemGrid[i] === 1) {
              itemGrid[i] = 0;
            }
          }
        }
        itemGrid[index] = tool.itemCode;
      }
      renderAllCells();
      clearError();
    }

    function clearCell(index) {
      clearSolution();
      itemGrid[index] = 0;
      renderAllCells();
      clearError();
    }

    function createGrid() {
      for (let y = 0; y < HEIGHT; y += 1) {
        for (let x = 0; x < WIDTH; x += 1) {
          const idx = cellIndex(x, y);
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cell";
          cell.dataset.index = String(idx);
          cell.addEventListener("mousedown", (event) => {
            if (event.button !== 0 && event.button !== 2) {
              return;
            }
            isMouseDown = true;
            activeMouseButton = event.button;
            if (event.button === 2) {
              clearCell(idx);
              return;
            }
            applyTool(idx);
          });
          cell.addEventListener("mouseenter", () => {
            if (isMouseDown) {
              if (activeMouseButton === 2) {
                clearCell(idx);
              } else {
                applyTool(idx);
              }
            }
          });
          cell.addEventListener("contextmenu", (event) => {
            event.preventDefault();
          });
          cell.addEventListener("click", () => applyTool(idx));
          gridEl.appendChild(cell);
        }
      }
      renderAllCells();
    }

    function createPalette() {
      TOOLS.forEach((tool) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tool";
        btn.dataset.toolKey = toolKey(tool);
        btn.title = tool.label;
        btn.innerHTML = `<span>${tool.emoji}</span><small class="token">${tool.token}</small>`;
        btn.addEventListener("click", () => setTool(tool));
        paletteEl.appendChild(btn);
      });
      setTool(TOOL_ITEMS[0]);
    }

    function createInitialInventorySelector() {
      if (!initialInventoryEl) {
        return;
      }

      RAINBOW_GEMS.forEach(([token, emoji], index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "gem-bit";
        btn.title = token;
        btn.innerHTML = `<span>${emoji}</span><small class="gem-bit-token">${token}</small>`;
        btn.addEventListener("click", () => {
          initialInventoryBits[index] = initialInventoryBits[index] ? 0 : 1;
          renderInitialInventoryBits();
          clearError();
        });
        initialInventoryEl.appendChild(btn);
      });

      renderInitialInventoryBits();
    }

    document.addEventListener("mouseup", () => {
      isMouseDown = false;
      activeMouseButton = -1;
    });

    complexityEl.addEventListener("input", syncComplexityLabel);

    function clearError(msg = "") {
      errorEl.textContent = msg;
    }

    function pushBits(bitArray, value, bitCount) {
      for (let i = 0; i < bitCount; i += 1) {
        bitArray.push((value >> i) & 1);
      }
    }

    function bitsToBytes(bits) {
      const byteCount = Math.ceil(bits.length / 8);
      const bytes = new Uint8Array(byteCount);
      for (let i = 0; i < bits.length; i += 1) {
        if (bits[i]) {
          bytes[i >> 3] |= 1 << (i & 7);
        }
      }
      return bytes;
    }

    function bytesToBits(bytes) {
      const bits = [];
      for (let i = 0; i < bytes.length; i += 1) {
        const byte = bytes[i];
        for (let b = 0; b < 8; b += 1) {
          bits.push((byte >> b) & 1);
        }
      }
      return bits;
    }

    function readBits(bits, cursor, bitCount) {
      let value = 0;
      for (let i = 0; i < bitCount; i += 1) {
        value |= (bits[cursor.pos + i] || 0) << i;
      }
      cursor.pos += bitCount;
      return value;
    }

    function toBase64Url(bytes) {
      let binary = "";
      bytes.forEach((n) => {
        binary += String.fromCharCode(n);
      });
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function fromBase64Url(str) {
      const padded = str.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((str.length + 3) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function encodeMap() {
      const bits = [];
      for (let i = 0; i < CELL_COUNT; i += 1) {
        pushBits(bits, itemGrid[i], BITS_PER_CELL);
      }

      const mapBytes = bitsToBytes(bits);
      const bytes = new Uint8Array(mapBytes.length + 1);
      bytes[0] = getInitialInventoryMask();
      bytes.set(mapBytes, 1);
      return toBase64Url(bytes);
    }

    function parseMap(serialized, bitsPerCell, hasInventoryHeader) {
      const bytes = fromBase64Url(serialized.trim());
      const headerBytes = hasInventoryHeader ? 1 : 0;
      if (bytes.length <= headerBytes) {
        return null;
      }

      const payload = hasInventoryHeader ? bytes.subarray(1) : bytes;
      if (payload.length * 8 < CELL_COUNT * bitsPerCell) {
        return null;
      }

      const bits = bytesToBits(payload);
      const cursor = { pos: 0 };
      const decodedGrid = new Uint8Array(CELL_COUNT);

      for (let i = 0; i < CELL_COUNT; i += 1) {
        const value = readBits(bits, cursor, bitsPerCell);
        if (value > ELEMENTS.length) {
          return null;
        }
        decodedGrid[i] = value;
      }

      return {
        inventoryMask: hasInventoryHeader ? bytes[0] : 0,
        grid: decodedGrid,
      };
    }

    function decodeMap(serialized) {
      const v2 = parseMap(serialized, MAP_VERSION_BITS_PER_CELL, true);
      if (v2) {
        itemGrid.set(v2.grid);
        setInitialInventoryFromMask(v2.inventoryMask);
        renderAllCells();
        return;
      }

      const noHeaderCurrent = parseMap(serialized, BITS_PER_CELL, false);
      if (noHeaderCurrent) {
        itemGrid.set(noHeaderCurrent.grid);
        setInitialInventoryFromMask(0);
        renderAllCells();
        return;
      }

      const noHeaderLegacy = parseMap(serialized, LEGACY_BITS_PER_CELL, false);
      if (noHeaderLegacy) {
        itemGrid.set(noHeaderLegacy.grid);
        setInitialInventoryFromMask(0);
        renderAllCells();
        return;
      }

      throw new Error("Decode failed: unsupported map format");
    }

    encodeBtn.addEventListener("click", () => {
      const compact = encodeMap();
      encodedEl.value = compact;
      clearError();
    });

    decodeBtn.addEventListener("click", () => {
      try {
        decodeMap(encodedEl.value);
        clearSolution();
        clearError();
      } catch (err) {
        clearError(err instanceof Error ? err.message : "Decode failed");
      }
    });

    clearBtn.addEventListener("click", () => {
      itemGrid.fill(0);
      setInitialInventoryFromMask(0);
      clearSolution();
      renderAllCells();
      clearError();
    });

    fillBtn.addEventListener("click", () => {
      if (selectedTool.kind !== "item") {
        clearError("Select a map element before Fill Empty");
        return;
      }
      if (selectedTool.itemCode === 1) {
        clearError("Fill Empty cannot use unicorn because only one unicorn is allowed");
        return;
      }
      for (let i = 0; i < CELL_COUNT; i += 1) {
        if (itemGrid[i] === 0) {
          itemGrid[i] = selectedTool.itemCode;
        }
      }
      clearSolution();
      renderAllCells();
      clearError();
    });

    generateBtn.addEventListener("click", () => {
      try {
        const plan = generateMutationPlan();
        itemGrid.fill(0);
        placeGeneratedItemsRandom(plan.tokens);
        renderSolution(plan);
        clearError();
      } catch (err) {
        clearError(err instanceof Error ? err.message : "Generate failed");
      }
    });

    copyBtn.addEventListener("click", async () => {
      const value = encodedEl.value.trim() || encodeMap();
      encodedEl.value = value;
      try {
        await navigator.clipboard.writeText(value);
        clearError("Copied");
      } catch {
        clearError("Clipboard unavailable in this browser context");
      }
    });

    createGrid();
    createPalette();
    createInitialInventorySelector();
    syncComplexityLabel();
    encodedEl.value = encodeMap();
  </script>
</body>
</html>
