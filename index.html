<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a42d92">
    <title>Gem Weaver Dash</title>
    <link rel="stylesheet" href="style.css"/>
    <link id="fav" rel="shortcut icon" type="image/x-icon">
</head>
<html lang="en">
<body>

    <svg id="ms" focusable="false">
      <path id="mp" d=""></path>
    </svg>
    <main>
      <section id="ld" class="show">
        <h1>LOADING</h1>
      </section>
      <section id="mn">
        <h1>
          <span sketch>GEM</span><br>
          <span sketch>WEAVER</span><br>
          <span sketch>DASH</span><br>
        </h1>
        <button id="newGame" class="btn" sketch>NEW GAME</button>
        <button class="btn" commandfor="confDialog" command="show-modal" sketch>OPTIONS</button>
      </section>
      <section id="gm">
        <div id="top">
          <div id="stats">
            <span sketch>DASH</span>
            <span id="sd" sketch>0</span>
            <span sketch>SPELL</span>
            <span id="ss" sketch>0</span>
          </div>
          <nav>
            <span id="redo" sketch>Q</span>
            <button id="conf" type="button" sketch commandfor="confDialog" command="show-modal">?</button>
          </nav>
          <div>
            <span sketch>LVL</span>
            <span id="lvn" sketch>1</span>
          </div>
        </div>
        <div class="grid-wrapper">
          <div id="gd">
            <canvas id="c1" width="960" height="540"></canvas>
            <i id="u">
              <span class="u0"></span>
              <span class="u1"></span>
              <span class="u-death u-death-bush"><span class="smoke-sheet"></span></span>
            </i>
            <span sketch help="1">TAP TO DASH</span>
            <span sketch help="2">COLLECT ALL 7 GEMS</span>
            <span sketch help="3">3 FRUIT GIVES 1</span>
            <span sketch help="7">1 GEM GIVES 1</span>
          </div>
        </div>
        <div id="iv" class="r">
          <i class="FR" data-i="FR" h></i>
          <i class="FO" data-i="FO" h></i>
          <i class="FY" data-i="FY" h></i>
          <i class="FG" data-i="FG" h></i>
          <i class="FC" data-i="FC" h></i>
          <i class="FB" data-i="FB" h></i>
          <i class="FV" data-i="FV" h></i>
          <!-- Filler elements to keep things aligned -->
          <span></span><span></span>
          <i class="GR" data-i="GR" h></i>
          <i class="GO" data-i="GO" h></i>
          <i class="GY" data-i="GY" h></i>
          <i class="GG" data-i="GG" h></i>
          <i class="GC" data-i="GC" h></i>
          <i class="GB" data-i="GB" h></i>
          <i class="GV" data-i="GV" h></i>
          <i class="GK" data-i="GK" h></i>
          <i class="GW" data-i="GW" h></i>
          <span sketch help="4">SELECT FRUITS</span>
          <span sketch help="5">ADD TO SPELL AREA</span>
        </div>
        <div id="tl">
          <div id="w">
            <div id="s1"><i></i></div>
            <div id="s2"><i></i></div>
            <div id="s3"><i></i></div>
          </div>
          <div id="sp">
            <span sketch help="6">USE ADD</span>
            <button id="add"></button>
            <button id="sub" class="hide"></button>
          </div>
        </div>
        <div>
          <span id="win" class="hide" sketch>SUCCESS!</span>
        </div>
      </section>
    </main>

    <dialog id="confDialog">
      <div sketch>GAME BY LOPIS FOR JS13K</div>
      <p>
        <label sketch for="tia">IMAGE ANIMATIONS</label>
        <input id="tia" type="checkbox">
        <span sketch>NO</span>
        <span sketch>YES</span>
      </p>
      <p>
        <label sketch for="dsm">MUSIC</label>
        <input id="dsm" type="checkbox">
        <span sketch>NO</span>
        <span sketch>YES</span>
      </p>
      <form method="dialog">
        <h3 sketch>SELECT LEVEL</h3>
        <div id="lv"></div>
        <button type="submit" class="btn" sketch>CLOSE</button>
      </form>
    </dialog>

    <script type="module" src="/src/index.ts"></script>
</body>
</html>
