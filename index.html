<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a42d92">
    <title>Gem Weaver Dash</title>
    <link rel="stylesheet" href="style.css"/>
    <link id="fav" rel="shortcut icon" type="image/x-icon">
</head>
<html lang="en">
<body>

    <svg id="ms" focusable="false">
      <path id="mp" d=""></path>
    </svg>
    <main>
      <section id="ld" class="show">
        <h1>LOADING</h1>
        <meter max="7" id="lm">
      </section>
      <section id="mn">
        <h1>
          <span sk>GEM</span><br>
          <span sk>WEAVER</span><br>
          <span sk>DASH</span><br>
        </h1>
        <button id="newGame" class="btn" sk>NEW GAME</button>
        <button class="btn" commandfor="confDialog" command="show-modal" sk>0PT10NS</button>
      </section>
      <section id="gm">
        <div id="top">
          <div id="stats">
            <span sk>DASH</span>
            <span id="sd" sk>0</span>
            <span sk>SPELL</span>
            <span id="ss" sk>0</span>
          </div>
          <nav>
            <span id="redo" sk>Q</span>
            <button id="conf" type="button" sk commandfor="confDialog" command="show-modal">?</button>
          </nav>
          <div>
            <span sk>LVL</span>
            <span id="lvn" sk>1</span>
          </div>
        </div>
        <div class="grid-wrapper">
          <div id="gd">
            <canvas id="c1" width="960" height="540"></canvas>
            <i id="u">
              <span class="u0"></span>
              <span class="u1"></span>
              <span class="puff"></span>
            </i>
            <span sk hp="1">TAP T0 DASH</span>
            <span sk hp="2">C0LLECT ALL 7 GEMS</span>
            <span sk hp="3">3 FRU1T G1VES 1</span>
            <span sk hp="7">1 GEM G1VES 1</span>
          </div>
        </div>
        <div id="iv" class="r">
          <i class="FR" data-i="FR" h></i>
          <i class="FO" data-i="FO" h></i>
          <i class="FY" data-i="FY" h></i>
          <i class="FG" data-i="FG" h></i>
          <i class="FC" data-i="FC" h></i>
          <i class="FB" data-i="FB" h></i>
          <i class="FV" data-i="FV" h></i>
          <!-- Filler elements to keep things aligned -->
          <span></span><span></span>
          <i class="GR" data-i="GR" h></i>
          <i class="GO" data-i="GO" h></i>
          <i class="GY" data-i="GY" h></i>
          <i class="GG" data-i="GG" h></i>
          <i class="GC" data-i="GC" h></i>
          <i class="GB" data-i="GB" h></i>
          <i class="GV" data-i="GV" h></i>
          <i class="GK" data-i="GK" h></i>
          <i class="GW" data-i="GW" h></i>
          <span sk hp="4">SELECT FRU1TS</span>
          <span sk hp="5">ADD T0 SPELL AREA</span>
        </div>
        <div id="tl">
          <div id="w">
            <div id="s1"><i></i></div>
            <div id="s2"><i></i></div>
            <div id="s3"><i></i></div>
          </div>
          <div id="sp">
            <span sk hp="6">USE ADD</span>
            <button id="add"></button>
            <button id="sub" class="hide"></button>
          </div>
        </div>
        <div>
          <span id="win" class="hide" sk>SUCCESS!</span>
        </div>
      </section>
    </main>

    <dialog id="confDialog">
      <div sk>GAME FR0M L0P1S F0R JS13K</div>
      <p>
        <label sk for="tia">1MAGE AN1MAT10NS</label>
        <input id="tia" type="checkbox">
        <span sk>ON</span>
        <span sk>OFF</span>
      </p>
      <p>
        <label sk for="dsm">MUS1C</label>
        <input id="dsm" type="checkbox">
        <span sk>ON</span>
        <span sk>OFF</span>
      </p>
      <form method="dialog">
        <h3 sk>SELECT LEVEL</h3>
        <div id="lv"></div>
        <button type="submit" class="btn" sk>CL0SE</button>
      </form>
    </dialog>

    <script type="module" src="/src/index.ts"></script>
</body>
</html>
