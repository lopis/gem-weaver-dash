<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainbow Rules Table</title>
    <style>
      :root {
        --paper: #f6f3eb;
        --ink: #1b1f23;
        --panel: #ffffffd9;
        --grid: #d7d2c8;
        --muted: #736c62;
        --accent: #0f4c5c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 10%, #fff7db 0%, transparent 48%),
          radial-gradient(circle at 85% 90%, #d9f5ff 0%, transparent 50%),
          linear-gradient(170deg, #f5f0e4 0%, #ebe7df 100%);
      }

      main {
        max-width: 1200px;
        margin: 24px auto 40px;
        padding: 0 16px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.5rem, 3vw, 2.3rem);
        letter-spacing: 0.02em;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      @media (min-width: 980px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--grid);
        border-radius: 14px;
        box-shadow: 0 8px 30px #0000000d;
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 12px 14px;
        font-size: 1rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        background: #ece7dc;
        border-bottom: 1px solid var(--grid);
      }

      .table-wrap {
        overflow: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        border: 1px solid var(--grid);
        text-align: center;
        font-size: clamp(0.56rem, 1.35vw, 0.84rem);
        padding: clamp(3px, 0.7vw, 7px) clamp(2px, 0.5vw, 5px);
      }

      th {
        font-weight: 650;
      }

      .corner {
        background: #efeade;
      }

      .cell {
        font-weight: 700;
        text-transform: lowercase;
      }

      .unknown {
        color: #8f8677;
        background: #f8f5ee;
        font-weight: 500;
      }

      .notes {
        margin-top: 16px;
        display: grid;
        gap: 12px;
      }

      .note {
        background: var(--panel);
        border: 1px solid var(--grid);
        border-radius: 12px;
        padding: 10px 12px;
      }

      .note h3 {
        margin: 0 0 6px;
        font-size: 0.92rem;
        text-transform: uppercase;
        color: var(--accent);
      }

      .note ul {
        margin: 0;
        padding-left: 18px;
      }

      .chips {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        border: 1px solid #00000022;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 0.76rem;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rainbow Spell Tables</h1>
      <p>
        Inputs include the 7 rainbow colors. Add uses commutative pair equations, while Sub uses
        directional rules as row - column.
      </p>

      <section class="grid" id="tables"></section>
    </main>

    <script>
      const inputs = ["red", "orange", "yellow", "green", "cyan", "blue", "violet", "black", "white"];
      const palette = {
        red: "#e63946",
        orange: "#f4a261",
        yellow: "#f6d743",
        green: "#4caf50",
        cyan: "#00bcd4",
        blue: "#3f51b5",
        violet: "#8e44ad",
        black: "#121212",
        white: "#ffffff",
        "?": "#f4efe6"
      };

      const textOn = {
        red: "#fff",
        orange: "#1f1f1f",
        yellow: "#1f1f1f",
        green: "#fff",
        cyan: "#1f1f1f",
        blue: "#fff",
        violet: "#fff",
        black: "#fff",
        white: "#1f1f1f"
      };

      const colorIds = {
        red: 0,
        orange: 1,
        yellow: 2,
        green: 3,
        cyan: 4,
        blue: 5,
        violet: 6,
        black: 7,
        white: 8
      };

      const addLUT = "0112666111236811233382233444633444566344566884566";
      const subLUT = "7700000270111127722223347233444573455556745666007";
      const complementLUT = [3, 5, 6, 0, 1, 1, 2, 8, 7];

      function lookupAdd(left, right) {
        const a = colorIds[left];
        const b = colorIds[right];

        if (a === 7) return right;
        if (b === 7) return left;
        if (a === 8 || b === 8) return "white";

        const result = addLUT.charCodeAt(a * 7 + b) - 48;
        return Object.keys(colorIds)[result] ?? "?";
      }

      function lookupSub(left, right) {
        const a = colorIds[left];
        const b = colorIds[right];

        if (a === 7) return "black";
        if (a === 8) return Object.keys(colorIds)[complementLUT[b]] ?? "?";
        if (b === 8) return "black";
        if (b === 7) return left;

        const result = subLUT.charCodeAt(a * 7 + b) - 48;
        return Object.keys(colorIds)[result] ?? "?";
      }

      function paint(el, token) {
        const bg = palette[token];
        if (!bg) {
          el.className = "unknown";
          el.textContent = token || "-";
          return;
        }
        el.className = "cell";
        el.style.background = bg;
        el.style.color = textOn[token] || "#111";
        el.textContent = token;
      }

      function getResult(op, a, b) {
        if (a === b) {
          return op === "add" ? a : "black";
        }
        if (op === "add") {
          return lookupAdd(a, b);
        }
        return lookupSub(a, b);
      }

      function createTable(title, op) {
        const panel = document.createElement("article");
        panel.className = "panel";
        panel.innerHTML = `<h2>${title}</h2><div class="table-wrap"></div>`;

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const hRow = document.createElement("tr");

        const corner = document.createElement("th");
        corner.className = "corner";
        corner.textContent = "-";
        hRow.appendChild(corner);

        for (const col of inputs) {
          const th = document.createElement("th");
          paint(th, col);
          hRow.appendChild(th);
        }

        thead.appendChild(hRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        for (const rowToken of inputs) {
          const tr = document.createElement("tr");
          const rowHead = document.createElement("th");
          paint(rowHead, rowToken);
          tr.appendChild(rowHead);

          for (const colToken of inputs) {
            const td = document.createElement("td");
            const out = getResult(op, rowToken, colToken);
            paint(td, out);
            tr.appendChild(td);
          }

          tbody.appendChild(tr);
        }

        table.appendChild(tbody);
        panel.querySelector(".table-wrap").appendChild(table);
        return panel;
      }

      const tables = document.getElementById("tables");
      tables.appendChild(createTable("Add", "add"));
      tables.appendChild(createTable("Sub (row - column)", "sub"));

      const note = document.getElementById("notes");
      const chips = document.createElement("div");
      chips.className = "chips";
      for (const name of ["red", "orange", "yellow", "green", "cyan", "blue", "violet", "black", "white"]) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.style.background = palette[name];
        chip.style.color = textOn[name] || "#111";
        chip.textContent = name;
        chips.appendChild(chip);
      }
      note.appendChild(chips);

      const rules = document.createElement("div");
      rules.className = "note";
      note.appendChild(rules);
    </script>
  </body>
</html>
